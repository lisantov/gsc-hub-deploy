# gsc-hub: nginx раздаёт статику приложения (build/client — она запечена в
# образ на этапе сборки) и проксирует всё остальное на контейнер app:3000.
#
# Подключается в /etc/nginx/conf.d/default.conf контейнера nginx.
# Проверка перед перезапуском:  docker compose exec nginx nginx -t
# Применение правок:             docker compose restart nginx

server {
    listen 80;
    server_name _;

    # Встроенный DNS Docker'а: адрес app перечитывается каждые 10 секунд, чтобы
    # после пересоздания контейнера приложения не отдавались 502 на старый IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $app_upstream http://app:3000;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Лимит тела запроса на стороне nginx (импорт CSV и т.п.); у приложения
    # свой лимит — BODY_SIZE_LIMIT.
    client_max_body_size 16m;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Хешированные файлы: кешируем навсегда, наружу отдаёт nginx.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # Остальная статика из build/client: js/css, картинки, шрифты.
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot)$ {
        expires 7d;
        try_files $uri @app;
    }

    # Машинные API: буферизацию выключаем, чтобы выгрузки CSV отдавались
    # потоком, а не копились в памяти nginx.
    location ^~ /api/ {
        proxy_pass $app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Страницы, маршруты и всё, чего нет в build/client, — SSR приложения.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass $app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# ── HTTPS (опционально) ──────────────────────────────────────────────────────
# 1. Положите сертификаты, например в ./deploy/cert/{fullchain.pem,privkey.pem}.
# 2. В compose.yaml раскомментируйте публикацию 443 и примонтируйте сертификаты:
#      - ./deploy/cert:/etc/nginx/cert:ro
# 3. Скопируйте блок server{…} выше, заменив `listen 80;` на:
#      listen 443 ssl;
#      http2 on;
#      ssl_certificate     /etc/nginx/cert/fullchain.pem;
#      ssl_certificate_key /etc/nginx/cert/privkey.pem;
#      ssl_protocols       TLSv1.2 TLSv1.3;
#      add_header Strict-Transport-Security "max-age=31536000" always;
# 4. В блоке для порта 80 оставьте только редирект:
#      return 301 https://$host$request_uri;
# И не забудьте сменить ORIGIN/AUTH_URL в .env на https://… — от этого зависит
# и OAuth-редирект, и флаг secure у сессионной cookie.

