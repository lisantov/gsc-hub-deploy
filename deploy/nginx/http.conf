# gsc-hub: HTTP-сервер. Статика приложения (build/client запечена в образ)
# и reverse proxy на app:3000 (SvelteKit, adapter-node).
#
# Копируется entrypoint'ом контейнера в /etc/nginx/conf.d/default.conf —
# этот блок работает всегда, даже пока нет сертификата.
# Проверка конфига:  docker compose exec nginx nginx -t
# Применение правок:  docker compose restart nginx

server {
    listen 80;
    server_name _;

    # Вызов ACME HTTP-01 от Let's Encrypt: файл кладёт контейнер certbot
    # в webroot /var/www/certbot. Нужен на :80 до и после выпуска сертификата.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/gsc/common.conf;
}
