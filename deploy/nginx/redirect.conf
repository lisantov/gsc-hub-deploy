# gsc-hub: редирект HTTP → HTTPS для основного домена.
# __DOMAIN__ подставляет entrypoint.sh из HTTPS_DOMAIN; файл появляется
# в conf.d (как zz-redirect.conf) только при наличии сертификата.
#
# Запросы на IP или с чужим Host продолжают обслуживаться http.conf —
# это позволяет проверять контейнер по адресу, пока TLS не настроен.

server {
    listen 80;
    server_name __DOMAIN__;

    # ACME обязан работать и на этом блоке: продление сертификата идёт
    # по Host домена, а не на IP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
