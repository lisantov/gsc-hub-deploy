# gsc-hub: HTTPS-сервер. Подключается в /etc/nginx/conf.d/zz-tls.conf только
# когда есть сертификат: entrypoint.sh держит симлинки
# /etc/nginx/tls/{fullchain,privkey}.pem на выпуск Let's Encrypt
# (/etc/letsencrypt/live/$HTTPS_DOMAIN). Редирект с :80 — в redirect.conf.
#
# Проверка конфига:  docker compose exec nginx nginx -t

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/gsc/common.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
}
